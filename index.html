const TF=[

["Бруннеровы железы лежат в подслизистой основе двенадцатиперстной кишки.",1,"Их щелочная слизь нейтрализует кислый химус."],
["Жёлчные капилляры имеют собственную стенку.",0,"Их стенку образуют мембраны соседних гепатоцитов."],
["Островки Лангерганса составляют большую часть массы поджелудочной железы.",0,"Они занимают всего 1–2 % массы, остальное — экзокринная часть."],
["Эозин окрашивает оксифильные структуры в розовый цвет.",1,"Гематоксилин окрашивает базофильные структуры в синий цвет."],
["Главные клетки желудка базофильны.",1,"Из-за развитого гранулярного ЭПС их цитоплазма окрашивается основными красителями."],
["Мышечная оболочка тонкой кишки состоит из двух слоёв.",1,"Это внутренний круговой и наружный продольный слои."]];
const MATCH=[
["Соедините клетку и её продукт",[["Выделяют HCl","Обкладочные"],["Вырабатывают пепсиноген","Главные"],["Секретируют слизь","Бокаловидные"],["Лизоцим в дне крипт","Клетки Панета"]]],
["Соедините клетку печени и её роль",[["Фагоцитируют бактерии","Клетки Купфера"],["Запасают витамин A","Клетки Ито"],["Образуют жёлчь","Гепатоциты"],["Выстилают синусоид","Эндотелиоциты"]]],
["Соедините гормон и клетку островка",[["Глюкагон","α-клетки"],["Инсулин","β-клетки"],["Соматостатин","δ-клетки"],["Панкреатический полипептид","PP-клетки"]]],
["Соедините признак и отдел кишки",[["Бруннеровы железы","Двенадцатиперстная"],["Пейеровы бляшки","Подвздошная"],["Тении","Толстая кишка"],["Самые длинные ворсинки","Тощая"]]],
["Соедините особенность и часть желудка",[["Слизистые железы у входа","Кардиальный отдел"],["Главные и обкладочные клетки","Фундальный отдел"],["Гастрин и сфинктер","Пилорический отдел"],["Косой, круговой, продольный слои","Мышечная оболочка"]]],
["Соедините структуру и орган",[["Ворсинки и крипты","Тонкая кишка"],["Классическая долька","Печень"],["Островки Лангерганса","Поджелудочная железа"],["Желудочные ямки","Желудок"]]],
["Соедините определение и термин",[["Окрашивается гематоксилином","Базофильный"],["Окрашивается эозином","Оксифильный"],["Концевой отдел железы","Ацинус"],["Трубчатое углубление эпителия","Крипта"]]],
["Соедините функцию и клетку кишки",[["Всасывание","Энтероциты"],["Захват антигенов","М-клетки"],["Секретин и холецистокинин","Эндокриноциты"],["Обновление эпителия","Камбиальные клетки"]]]];
const POOL=[...MC.map(([q,o])=>({q,o,c:0})),...TF.map(([q,v,e])=>({q,o:["Верно","Неверно"],c:v?0:1,e,tf:1}))];
const MAX_PLAYERS=20;
const N=15,T=20,TM=40,SH=["▲","◆","●","■"],PFX="oshgu-hist-";
const app=document.getElementById("app");
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e[k]=a[k];else if(a[k]!=null&&a[k]!==false)e.setAttribute(k,a[k])}c.flat().forEach(x=>{if(x!=null)e.append(x)});return e};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a};
const brand=()=>h("div",{class:"brand"},h("img",{src:"logo.png",alt:"",onerror:function(){this.remove()}}),h("span",{class:"dot"}),"ОШГУ · ГИСТОЛОГИЯ");
const show=(wide,...n)=>{app.className=wide?"wide":"";app.replaceChildren(brand(),...n)};
const ordinal=i=>["🥇","🥈","🥉"][i]||String(i+1);
let timer=null;

/* ---------- СВЯЗЬ: публичные MQTT-серверы через WebSocket (без прямых соединений между телефонами) ---------- */
const BROKERS=[{u:"wss://public.cloud.shiftr.io:443",o:{username:"public",password:"public"}},{u:"wss://mqtt.eclipseprojects.io:443/mqtt"},{u:"wss://broker.emqx.io:8084/mqtt"},{u:"wss://test.mosquitto.org:8081"}];
const ROOT="oshgu-hist-v2/";
const rid=()=>Math.random().toString(36).slice(2,10);
const mq=(b)=>mqtt.connect(b.u,Object.assign({clientId:"oq_"+rid()+rid(),clean:true,keepalive:30,connectTimeout:6000,reconnectPeriod:2000,protocolVersion:4},b.o||{}));
let hcl=[],pcl=null,hostSweep=null,hbTimer=null,pTry=null,jt=null,guardT=null,pbase="";
function stopAll(){
  hcl.forEach(c=>{try{c.end(true)}catch(e){}});hcl=[];
  if(pcl){try{pcl.end(true)}catch(e){}pcl=null}
  clearInterval(timer);clearInterval(hostSweep);clearInterval(hbTimer);clearInterval(jt);clearTimeout(hostTimer);clearTimeout(pTry);clearTimeout(guardT);
  hostTimer=null;hostBody=null;lbEl=null;
}

/* ---------- ЭКРАН ВХОДА ---------- */
function landing(){
  stopAll();joinBusy=false;
  const qc=new URLSearchParams(location.search).get("c")||"";
  const code=h("input",{inputmode:"numeric",maxlength:"4",placeholder:"Код игры",value:qc.replace(/\D/g,"").slice(0,4)});
  const nm=h("input",{maxlength:"20",placeholder:"Ваше имя"});
  const err=h("div");
  const go=()=>{const c=code.value.trim(),n=nm.value.trim();if(c.length!==4){code.focus();return}if(!n){nm.focus();return}playerJoin(c,n,err)};
  nm.onkeydown=e=>{if(e.key==="Enter")go()};
  show(false,h("h1",{},"Викторина по гистологии"),h("p",{class:"mut"},"Желудок, кишечник, печень и поджелудочная железа. 15 вопросов у каждого свои, а рейтинг виден на общем экране. До "+MAX_PLAYERS+" участников."),
    h("div",{class:"grid2"},
      h("div",{class:"card"},h("h2",{},"Я участник"),code,nm,err,h("button",{class:"btn",onclick:go},"Войти в игру")),
      h("div",{class:"card"},h("h2",{},"Я веду игру"),h("p",{class:"mut"},"Откройте это окно на электронной доске. Появится код, по которому зайдут одногруппники."),h("button",{class:"btn red",onclick:hostStart},"Начать"))));
}

/* ---------- ВЕДУЩИЙ (ЭЛЕКТРОННАЯ ДОСКА) ---------- */
let P=new Map(),phase="lobby",hcode="",hostTimer=null,lbEl=null,rowEls=new Map(),hostBody=null;
const hostFatal=()=>show(false,h("div",{class:"card"},h("h2",{},"Нет связи с сервером"),h("p",{},"Проверьте интернет на доске и обновите страницу."),h("button",{class:"btn",onclick:landing},"Назад")));
function pubAll(sub,obj){const s=JSON.stringify(obj);hcl.forEach(c=>{if(c.connected){try{c.publish(ROOT+hcode+"/"+sub,s,{qos:0})}catch(e){}}})}
function hostStart(){
  stopAll();
  P=new Map();phase="lobby";rowEls=new Map();
  hcode=String(1000+Math.floor(Math.random()*9000));
  show(false,h("p",{class:"mut"},"Создаём игру…"));
  if(typeof mqtt==="undefined"){hostFatal();return}
  let shown=false;
  /* ведущий подключается ко всем серверам сразу, игрок — к любому из них */
  BROKERS.forEach(b=>{
    const c=mq(b);hcl.push(c);
    c.on("connect",()=>{c.subscribe(ROOT+hcode+"/up",{qos:0});if(!shown){shown=true;hostLobby()}else hostUpd()});
    c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}hostData(m)});
    c.on("close",()=>hostUpd());
    c.on("error",()=>{});
  });
  pTry=setTimeout(()=>{if(!shown)hostFatal()},15000);
  hostSweep=setInterval(()=>{const now=Date.now();P.forEach(p=>{if(p.on&&now-p.seen>16000)p.on=false});hostUpd()},3000);
}
function hostData(m){
  if(!m||!m.id)return;
  const id=String(m.id).slice(0,40);
  const p0=[...P.values()].find(x=>x.id===id);
  if(m.t==="join"){
    let p=p0,resume=false;
    if(p){p.on=true;p.seen=Date.now();resume=p.q>0}
    else{
      if(P.size>=MAX_PLAYERS){pubAll("to/"+id,{t:"reject",message:"В игре уже "+MAX_PLAYERS+" участников."});return}
      if(phase==="end"){pubAll("to/"+id,{t:"reject",message:"Игра завершена. Дождитесь нового кода."});return}

function wait(){banner=h("div",{class:"msg",style:"display:none"});show(false,h("div",{class:"card",style:"text-align:center"},h("h1",{},"Вы в игре!"),h("p",{style:"font-size:28px;font-weight:800"},name),h("p",{class:"mut"},"Ждите, пока ведущий нажмёт «Старт». Смотрите на экран доски.")));}
