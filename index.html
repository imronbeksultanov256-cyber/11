  if(joinBusy)return;joinBusy=true;
  stopAll();
  playerId=globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random();
  name=nm;left=false;joined=false;playing=false;finished=false;lastLB=null;pbase=ROOT+code+"/";
  const status=t=>{if(!joined&&!left)errEl.replaceChildren(h("p",{class:"mut"},t))};
  const fail=t=>{left=true;joinBusy=false;clearTimeout(guardT);clearTimeout(pTry);clearInterval(jt);errEl.replaceChildren(h("div",{class:"msg"},t));if(pcl){try{pcl.end(true)}catch(e){}pcl=null}};
